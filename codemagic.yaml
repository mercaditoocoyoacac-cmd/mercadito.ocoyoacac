workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        profiles:
          - Mercadito Ocoyoacac AppStore
        certificates:
          - Mercadito Ocoyoacac Distribution
      vars:
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: AIzaSyCCERrdID-FSfeNDkZDI4bOruDzV01TMj8
      node: 20
      xcode: 16
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=$APP_STORE_TEAM_ID \
            PROVISIONING_PROFILE_SPECIFIER="Mercadito Ocoyoacac AppStore"
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            -exportPath $CM_BUILD_DIR/build \
            -exportOptionsPlist export_options.plist
    artifacts:
      - $CM_BUILD_DIR/build/*.ipa
      - $CM_BUILD_DIR/build/*.dSYM.zip
    publishing:
      app_store_connect:
        apple_id: $APP_STORE_APPLE_ID
        password: $APP_STORE_PASSWORD

  android-build:
    name: Android Build
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      vars:
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: AIzaSyCCERrdID-FSfeNDkZDI4bOruDzV01TMj8
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build Android
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
