<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f59e0b" />
    <title>Sin conexión | Mercadito Ocoyoacac</title>
    <style>
      :root {
        color-scheme: light dark;
        --fondo: #ffffff;
        --texto: #171717;
        --suave: #525252;
        --acento: #b45309;
        --borde: #e5e5e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fondo: #171717;
          --texto: #fafafa;
          --suave: #a3a3a3;
          --acento: #fbbf24;
          --borde: #404040;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--fondo);
        color: var(--texto);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
        border: 1px solid var(--borde);
        border-radius: 16px;
        padding: 32px 24px;
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.5rem; margin: 20px 0 8px; }
      p { color: var(--suave); margin: 0 0 24px; }
      button {
        background: var(--acento);
        color: #ffffff;
        border: 0;
        border-radius: 10px;
        padding: 12px 24px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        min-height: 44px;
      }
      button:focus-visible { outline: 3px solid var(--acento); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Mercadito Ocoyoacac" />
      <h1>Sin conexión a internet</h1>
      <p>No pudimos cargar esta página. Revisa tu conexión y vuelve a intentarlo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
